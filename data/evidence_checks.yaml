checks:
  - id: posting-criteria
    title: "What does the posting actually ask for?"
    facts:
      - "Fictional Support Assistant brief: update help articles once a week."
      - "Comfort using a spreadsheet is listed as a requirement."
      - "Training on the team's analytics tool is provided. No certificate is mentioned."
    statements:
      - text: "An analytics certificate is required before applying."
        finding: "Not supported by the supplied facts"
        why: "The brief describes tool training, not a certificate requirement. Do not turn an unstated qualification into a stated one."
      - text: "The brief explicitly asks for comfort using a spreadsheet."
        finding: "Supported by the supplied facts"
        why: "The second line says this directly. It does not establish whether any particular person meets the requirement."
      - text: "Training means no previous experience of any kind is needed."
        finding: "Not supported by the supplied facts"
        why: "Training on one tool does not describe every requirement for the role. The spreadsheet requirement is still stated."
    retry: "On another visit, replace one unsupported statement with a question you could check against the full posting."
    secondLook:
      title: "An optional qualification is clarified"
      fact: "A later note in this fictional brief says: an analytics certificate is optional. The spreadsheet requirement remains unchanged."
      question: "What can you now say about the certificate, and what should you avoid concluding?"
      changes: "The certificate is explicitly optional in this brief; that is stronger evidence than its absence from the first excerpt. Comfort using a spreadsheet is still stated as a requirement."
      uncertain: "The new note does not say that the spreadsheet requirement is the only requirement, or establish whether a particular person meets the full brief."
    route: "posting"
  - id: project-evidence
    title: "Who did what in the project?"
    facts:
      - "Fictional study project: you wrote three test cases for a settings screen."
      - "One case exposed a label that did not match the saved setting. A teammate fixed the label."
      - "You repeated the three cases after the fix. No user or time-saving data was collected."
    statements:
      - text: "I rebuilt the settings screen on my own."
        finding: "Not supported by the supplied facts"
        why: "Your recorded contribution was writing and repeating test cases. The teammate made the fix; the facts do not say who built the entire screen."
      - text: "My work reduced support time by half."
        finding: "Not supported by the supplied facts"
        why: "No time-saving data was collected. A discovered mismatch is an observed result, not evidence of a measured business impact."
      - text: "My test case exposed a label mismatch, and I repeated the cases after a teammate fixed it."
        finding: "Supported by the supplied facts"
        why: "This keeps your contribution, the teammate's action and the follow-up check separate. The experience is fictional and must not be presented as your own."
    retry: "On another visit, explain the same contribution in two sentences without adding a number or taking credit for the fix."
    secondLook:
      title: "A follow-up check adds a result"
      fact: "A later note for this fictional project says all three test cases passed after the teammate's fix. No user or time-saving data was collected."
      question: "Which result could the project description now include without claiming a business impact?"
      changes: "The description can now say: I repeated the three test cases after a teammate fixed the label, and all three passed. This adds an observed check result while preserving who did what."
      uncertain: "Passing those three cases does not establish that the entire screen is defect-free, or show a reduction in support time. This remains fictional experience, not a claim to copy as your own."
    route: "experience"
  - id: remote-details
    title: "What does a remote label leave unanswered?"
    facts:
      - "Fictional role brief: remote work, with shared collaboration hours."
      - "The excerpt does not state the hours, time zone or permitted work locations."
      - "No other employer information is supplied for this exercise."
    statements:
      - text: "The collaboration hours, time zone and work-location details still need clarification."
        finding: "Supported by the supplied facts"
        why: "Those details are absent from the excerpt. The word remote does not supply them, and this exercise does not determine anyone's eligibility."
      - text: "The role can be done at any hour from any country."
        finding: "Not supported by the supplied facts"
        why: "The excerpt leaves locations unspecified and explicitly mentions shared hours. It cannot establish unlimited schedule or location flexibility."
      - text: "Shared hours mean everyone works the same full-day schedule."
        finding: "Not supported by the supplied facts"
        why: "Some shared hours do not establish an identical full-day schedule. The extent of overlap is still unknown."
    retry: "On another visit, ask one neutral question about the missing work-location details without assuming what the answer will be."
    secondLook:
      title: "Part of the schedule becomes clear"
      fact: "A later note in this fictional brief specifies shared collaboration hours of 14:00-16:00 UTC on Tuesdays and Thursdays. It still gives no work-location details."
      question: "Which part of the first answer needs updating, and which detail still needs clarification?"
      changes: "The shared collaboration window and its time zone are now stated. It would be inaccurate to keep describing those specific details as missing."
      uncertain: "The rest of the schedule and the work-location details are still unspecified. A stated collaboration window does not establish a full-day schedule or permission to work from any location."
    route: "questions"
  - id: deliverable-scope
    title: "What belongs in the requested output?"
    facts:
      - "Fictional demo task: submit one screenshot and one paragraph describing what it shows."
      - "The demo can export a CSV. No automatic updates to downloaded files are described."
      - "No slide deck or additional file is requested."
    statements:
      - text: "A slide deck and CSV are required deliverables."
        finding: "Not supported by the supplied facts"
        why: "A feature the demo supports is not automatically a requested output. The brief asks for a screenshot and a paragraph."
      - text: "The requested output is one screenshot with one descriptive paragraph."
        finding: "Supported by the supplied facts"
        why: "This follows the stated format without adding deliverables. For a real task, use its actual instructions rather than this fictional brief."
      - text: "Any downloaded CSV automatically reflects future edits."
        finding: "Not supported by the supplied facts"
        why: "Export support alone does not establish automatic synchronization. The facts do not describe that behavior."
    retry: "On another visit, name the feature-versus-deliverable distinction and one final check you would make against the brief."
    secondLook:
      title: "The brief requests an additional file"
      fact: "A revised version of this fictional task explicitly adds one exported CSV file to the screenshot and descriptive paragraph. It says nothing about automatic updates."
      question: "What is now part of the requested output, and which earlier assumption remains unsupported?"
      changes: "The revised brief now requests a CSV as well as the screenshot and paragraph. The new instruction, not the mere existence of an export feature, makes the CSV a deliverable."
      uncertain: "There is still no evidence that the downloaded CSV updates automatically. A slide deck is still not requested."
    route: "task-brief"
