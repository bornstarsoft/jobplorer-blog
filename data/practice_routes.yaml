routes:
  - id: posting
    title: "Read a posting with fewer assumptions"
    outcome: "A responsibility, a stated criterion and an unanswered question."
    nextVisit: "Return to the fresh posting scenario. Explain why its work-arrangement label does not supply a location or schedule."
    steps:
      - title: "Separate facts from missing details"
        path: "/job-seeker-tools/weekly-practice/"
        anchor: "week-1"
        focus: "In the fictional posting, find one responsibility, one requirement and one preference before opening the worked response."
      - title: "Try a different posting"
        path: "/job-seeker-tools/weekly-practice/"
        anchor: "challenge-1"
        focus: "Keep the stated training separate from assumptions about experience. Turn the missing office details into a question."
      - title: "Ask about competing priorities"
        path: "/job-seeker-tools/interview-practice/"
        anchor: "clarify-priorities"
        focus: "Form one neutral question about who decides when requests conflict, then compare with the example and follow-up."
  - id: experience
    title: "Explain your contribution clearly"
    outcome: "An action and an observed result without an invented metric."
    nextVisit: "Return to the small-improvement question. Try its follow-up and describe how you would check a later draft without claiming results you have not measured."
    steps:
      - title: "Remove unsupported claims"
        path: "/job-seeker-tools/weekly-practice/"
        anchor: "week-2"
        focus: "Rewrite the fictional project statement, separating the applicant's checklist from the teammate's implementation."
      - title: "Keep the result within the evidence"
        path: "/job-seeker-tools/weekly-practice/"
        anchor: "challenge-2"
        focus: "Explain what the form test found without turning a corrected error message into sign-up growth."
      - title: "Describe a small improvement"
        path: "/job-seeker-tools/interview-practice/"
        anchor: "improve-a-task"
        focus: "Try a three-sentence response, then distinguish the observed drafts from a proposed follow-up check."
  - id: questions
    title: "Prepare work-focused interview questions"
    outcome: "Two distinct questions and one useful follow-up."
    nextVisit: "Return to the review-process question. Use Another round to ask about conflicting feedback without assuming the team handles it badly."
    steps:
      - title: "Replace an assumption with a question"
        path: "/job-seeker-tools/weekly-practice/"
        anchor: "week-3"
        focus: "Use the fictional brief to ask about two different uncertainties. Do not repeat the call details already supplied."
      - title: "Ask about an unanswered handoff"
        path: "/job-seeker-tools/weekly-practice/"
        anchor: "challenge-3"
        focus: "Ask how work moves between time zones without treating the time-zone difference as evidence of delays."
      - title: "Clarify how work is reviewed"
        path: "/job-seeker-tools/interview-practice/"
        anchor: "clarify-feedback"
        focus: "Ask about the review process. In the follow-up example, separate what was said from what remains unknown."
  - id: task-brief
    title: "Check a task against its brief"
    outcome: "Two supported steps and a caution that matches the supplied facts."
    nextVisit: "Return to the export challenge and explain the effect of reversing the steps. Check the requested output format as well as the order."
    steps:
      - title: "Match the requested output"
        path: "/job-seeker-tools/weekly-practice/"
        anchor: "week-4"
        focus: "Use only the fictional demo facts to produce two steps and one caution. Remove the unsupported backup promise."
      - title: "Catch a missing step before export"
        path: "/job-seeker-tools/weekly-practice/"
        anchor: "challenge-4"
        focus: "Check which version is exported and why refreshing afterward cannot change the file already downloaded."
      - title: "Explain a concrete final check"
        path: "/job-seeker-tools/interview-practice/"
        anchor: "learn-from-a-mistake"
        focus: "Try the follow-up about checking a file. Name what you would inspect, rather than promising never to make another mistake."
  - id: rewrite-review
    title: "Check a rewritten summary against its source"
    outcome: "A corrected requirement, a clearly labeled plan and a result limited to the evidence."
    nextVisit: "Return to the proposed-check exercise and try Another try: one classmate follows the step, while the other asks for clarification. Describe only those observations, without claiming universal clarity or time savings."
    steps:
      - title: "Keep preferences separate from requirements"
        path: "/guides/use-ai-for-job-search-preparation/"
        anchor: "practice-preferences"
        focus: "Find the two unsupported requirements in the fictional rewrite. Replace them with wording that preserves what the posting actually says, then compare with the worked response."
      - title: "Separate a plan from an observed result"
        path: "/guides/use-ai-for-job-search-preparation/"
        anchor: "practice-proposed-results"
        focus: "The handoff note has changed, but its trial has not happened. Explain the completed action and planned check without claiming faster completion or fewer errors."
      - title: "Transfer the check to a project summary"
        path: "/job-seeker-tools/weekly-practice/"
        anchor: "challenge-2"
        focus: "In the fictional form test, distinguish the applicant's test cases from the teammate's rewrite. Explain the repeated check without claiming sign-up growth."
