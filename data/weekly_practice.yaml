edition: "Four-week starter series"
revisit:
  - number: 1
    title: "Spot what is still unknown"
    scenario: "A fictional Content Operations Assistant posting gives these details."
    evidence:
      - "Check article links and report broken ones."
      - "Training on the team's publishing tool is provided."
      - "The role is hybrid. The posting does not give office days or a location."
    prompt: "Name one responsibility, one stated support, and one question. Does the hybrid label alone tell you where or when you would work?"
    answer:
      - "Responsibility: check article links and report broken ones."
      - "Stated support: training on the team's publishing tool. This does not describe every requirement."
      - "Question: what office location and in-person schedule apply? The hybrid label does not supply either detail."
    why: "Keep the stated training separate from assumptions about experience requirements. Missing information remains a question."
    check: "Did you leave the office location and schedule unknown instead of filling them in?"
    compare: "Compare with week 1: remote work left shared hours unclear; hybrid work leaves office days and location unclear here. Which exact detail would you ask about in each case? Neither label supplies a complete schedule."
    review: 1
  - number: 2
    title: "Keep a result within the evidence"
    scenario: "A fictional applicant helped test a student group's sign-up form."
    evidence:
      - "The applicant wrote six test cases."
      - "One test exposed an unclear error message. A teammate rewrote it."
      - "The group repeated the six cases. No completion-rate or audience data was recorded."
    prompt: "Replace 'I redesigned the form and doubled sign-ups' with a two-sentence explanation supported by these facts."
    answer:
      - "I wrote six test cases for our student group's sign-up form and identified an unclear error message."
      - "A teammate rewrote the message, and we repeated the six cases; we did not measure sign-up growth."
    why: "The revised explanation names an actual contribution and a follow-up check without turning a small test into a business result."
    check: "Are ownership and measured outcomes kept separate? Never present this fictional experience as your own."
    compare: "Compare with week 2: a restart checklist exposed a timer issue; six form tests exposed an unclear message here. What did the applicant do in each example, and what did the teammate do? Neither example measures audience growth."
    review: 2
  - number: 3
    title: "Ask about an unanswered handoff"
    scenario: "A fictional role brief and invitation contain the following information."
    evidence:
      - "The team supports colleagues in two time zones."
      - "Work includes handing unfinished requests to another colleague."
      - "The invitation already gives the interview time and meeting link."
    prompt: "Replace 'Does working across time zones make everyone slow?' with one neutral question about the handoff."
    answer:
      - "What information does the team include when handing an unfinished request to a colleague in another time zone?"
    why: "Two time zones do not prove delays. This question asks about a specific process rather than assuming a problem."
    check: "Does the question address something the brief has not already answered?"
    compare: "Compare with week 3: several request sources raised a question about prioritization; two time zones raise a question about handoffs here. How would the question change while staying neutral about a process you have not observed?"
    review: 3
  - number: 4
    title: "Catch a missing step before export"
    scenario: "A fictional demo brief asks for two steps and one caution about downloading a report."
    evidence:
      - "Choose Refresh to include the latest changes in the preview."
      - "Choose Download to export the report currently in the preview."
      - "A downloaded report does not update when the source changes later."
    prompt: "Correct 'Download first, then Refresh; your saved report will always update.' Keep two steps and one caution."
    answer:
      - "Step 1: Choose Refresh to update the preview."
      - "Step 2: Choose Download to export the report shown."
      - "Caution: later source changes do not update the saved report; refresh and download again for a newer copy."
    why: "The order matters: downloading before refreshing can export an older preview. The caution avoids an unsupported automatic-update promise."
    check: "Did you preserve the requested format and put the refresh before the download?"
    compare: "Compare with week 4: Preview then Export becomes Refresh then Download here. Which supplied fact determines the first step? In both examples, later changes do not update a downloaded file."
    review: 4
weeks:
  - number: 1
    title: "Read beyond the job title"
    situation: "I am deciding which posting to explore."
    outcome: "Separate the work, stated criteria, and missing details."
    minutes: "5-10 min"
    scenario: "A fictional Product Support Assistant posting contains these lines. No other employer information is available."
    evidence:
      - "Answer setup questions and maintain help articles."
      - "Clear written communication is required."
      - "Experience using issue-tracking software is helpful, not essential."
      - "The team works remotely; some shared collaboration hours apply."
    prompt: "Identify one responsibility, one required criterion, one preference, and one detail to clarify. Do not decide whether a real person qualifies."
    answer:
      - "Responsibility: answering setup questions or maintaining help articles."
      - "Required criterion: clear written communication, as explicitly stated."
      - "Preference: issue-tracking software experience; the posting calls it helpful, not essential."
      - "Clarification: which shared hours and time zone apply? The remote label does not answer this."
    why: "The categories come from the wording supplied, not assumptions about the title. A preference is not rewritten as a requirement, and missing schedule details remain questions."
    check: "Can you point to the line behind each conclusion? Keep an unanswered question separate from a fact."
    next: "For your own research, choose one posting and identify a detail that needs checking before you proceed. Keep personal notes off this site."
    guide: "/guides/read-a-job-posting/"
    guideTitle: "Read a Job Posting"
  - number: 2
    title: "Explain experience without adding claims"
    situation: "I am preparing an application example."
    outcome: "Turn a vague statement into a specific, supportable explanation."
    minutes: "5-10 min"
    scenario: "A fictional applicant contributed to a two-person study project. These are the only recorded facts."
    evidence:
      - "The applicant wrote a checklist for testing a puzzle's restart flow."
      - "The teammate implemented the restart code."
      - "The checklist caught a timer that did not reset; the teammate fixed it."
      - "After the fix, both checked the restart from an unfinished and a completed level. No player or revenue data was collected."
    prompt: "Replace this unsupported draft with two or three truthful sentences: 'I built the entire game and improved player retention by 40%.'"
    answer:
      - "In a two-person study project, I wrote a checklist for the puzzle's restart flow."
      - "It caught a timer that did not reset, which my teammate fixed; we then checked the restart from unfinished and completed levels."
      - "This was a small project test, not evidence of improved player retention."
    why: "The example names the applicant's contribution, the teammate's work, and an observed result. The 40% figure and ownership of the entire game have no support in the supplied facts."
    check: "Could you explain each sentence using the evidence above? Do not use this invented experience as your own."
    next: "Choose one real example you can safely discuss and distinguish your own contribution from the team's."
    guide: "/guides/build-a-project-case-study/"
    guideTitle: "Build a Project Case Study"
  - number: 3
    title: "Turn an assumption into a useful question"
    situation: "I am getting ready for a conversation."
    outcome: "Ask about the work without inventing a problem or repeating known details."
    minutes: "5-10 min"
    scenario: "A fictional invitation and role description provide these details. The conversation allows questions about the work."
    evidence:
      - "The team maintains internal reporting tools."
      - "Requests arrive from several teams."
      - "The role includes working with a reviewer before releasing changes."
      - "The invitation already states that the conversation is a 30-minute video call."
    prompt: "Rewrite 'Why is your request process so chaotic?' into a neutral question. Add a second question about a different unanswered aspect of the work."
    answer:
      - "How does the team decide which request to work on when several arrive together?"
      - "What does the review process look like before a change is released?"
    why: "Several request sources do not prove a chaotic process. The questions ask for concrete workflow details without assuming the answers. Asking about call length would repeat information already supplied."
    check: "Does each question resolve a different uncertainty? Adapt if the conversation has already answered it."
    next: "Prepare two work-focused questions for your next conversation, using the actual invitation and public role description."
    guide: "/guides/prepare-for-an-interview/"
    guideTitle: "Prepare for an Interview"
  - number: 4
    title: "Check a deliverable against its brief"
    situation: "I have a task or work sample to prepare."
    outcome: "Meet the stated scope and flag an unsupported promise."
    minutes: "5-10 min"
    scenario: "A fictional task asks for two instruction steps and one caution, using only the following facts about a demo."
    evidence:
      - "Choose Preview to inspect a draft."
      - "Choose Export to download the version currently shown in Preview."
      - "Later edits do not update an already downloaded file."
      - "No automatic backup or sharing feature is described."
    prompt: "Correct this draft: 'Choose Preview, then Export. Every downloaded file automatically stays up to date and has a cloud backup.' Keep exactly two steps and one caution."
    answer:
      - "Step 1: Choose Preview and check the draft shown."
      - "Step 2: Choose Export to download that version."
      - "Caution: later edits do not update the downloaded file; export again if you need a changed version."
    why: "Automatic updates contradict the facts, and cloud backup is not described. The response retains the requested scope instead of inventing features or building an unnecessary solution."
    check: "Are there exactly two steps and one caution? Is each statement supported by the brief?"
    next: "At your next review, choose one habit to repeat: trace a claim to a source, ask a clearer question, or inspect a final deliverable."
    guide: "/guides/prepare-for-a-work-sample-task/"
    guideTitle: "Prepare for a Work Sample Task"
